description: |
  Listener to subscribe to input events and send HID updates after processing

  Copy of ZMK's v0.3 `zmk,input-listener`.

compatible: "zmk,input-listener-accel"

properties:
  device:
    type: phandle
    required: true
  input-processors:
    type: phandle-array
  move-accelerator:
    type: phandle
    description: |
      `zmk,input-accelerator` applied to X/Y mouse movement once a whole report
      has arrived (at sync), after the input processors. Scrolling isn't
      accelerated.

child-binding:
  description: "Listener overrides for certain layers"

  properties:
    layers:
      type: array
      required: true
    process-next:
      type: boolean
    input-processors:
      type: phandle-array
